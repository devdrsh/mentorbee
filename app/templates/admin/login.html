{% extends "admin/base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-screen p-4 bg-gradient-to-br from-amber-50/50 via-white to-amber-100/30">
    <div class="px-6 sm:px-8 py-8 text-left bg-white shadow-xl shadow-amber-500/5 w-full max-w-md rounded-3xl border border-amber-200/80">
        <div class="flex justify-center mb-5">
            <img src="/static/img/logo.png" alt="MentorBee" class="h-14 sm:h-16 w-auto object-contain">
        </div>
        <h3 class="text-xl sm:text-2xl font-extrabold text-center text-slate-900 mb-1">Admin Portal</h3>
        <p class="text-xs sm:text-sm text-center text-slate-500 mb-6">Manage session links and live broadcasts</p>
        
        <form id="loginForm">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1" for="email">Admin Email</label>
                    <input type="email" id="email" placeholder="admin@mentorbee.com" required
                        class="w-full px-4 py-3 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400 transition-all font-medium">
                </div>
                <div>
                    <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1" for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required
                        class="w-full px-4 py-3 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400 transition-all font-medium">
                </div>
                <button type="submit" class="w-full px-6 py-3.5 mt-2 text-slate-950 font-bold bg-amber-400 rounded-xl shadow-md shadow-amber-400/25 hover:bg-amber-500 active:scale-[0.98] transition-all text-sm">
                    Log In to Dashboard
                </button>
                <div id="error" class="text-red-600 text-xs sm:text-sm mt-3 text-center hidden font-semibold bg-red-50 py-2.5 px-3 rounded-xl border border-red-200"></div>
            </div>
        </form>
        
        <div class="mt-6 text-center">
            <a href="/" class="text-xs font-bold text-amber-700 hover:text-amber-800 transition-colors">← Back to Mentor Dashboard</a>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = e.target.querySelector('button');
    const originalText = btn.textContent;
    btn.textContent = 'Logging in...';
    btn.disabled = true;
    
    try {
        const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            localStorage.setItem('admin_token', data.access_token);
            window.location.href = '/admin/dashboard';
        } else {
            const errDiv = document.getElementById('error');
            errDiv.textContent = data.detail || 'Login failed';
            errDiv.classList.remove('hidden');
            btn.textContent = originalText;
            btn.disabled = false;
        }
    } catch (error) {
        console.error(error);
        btn.textContent = originalText;
        btn.disabled = false;
    }
});
</script>
{% endblock %}
