services:
  - type: web
    name: mentorbee-meeting-system
    env: python
    buildCommand: "pip install -r requirements.txt && python bootstrap.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./mentorbee.db
